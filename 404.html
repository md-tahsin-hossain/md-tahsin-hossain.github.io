  <link rel="icon" href="/favicon.ico" sizes="any">
  <script>
    // Old links used capitalised file names (e.g. /Contact.html). Send them to the lowercase page.
    (function () {
      var path = location.pathname, lower = path.toLowerCase();
      if (lower === "/home.html") lower = "/";
      if (path !== lower) location.replace(lower + location.search + location.hash);
    })();
  </script>
